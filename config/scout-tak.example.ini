# AetherLink Scout optional output only; this does not configure capture feeds.
# Copy into ignored config/local-tak.ini with mode 600.
# Run: .venv/bin/python -m aetherlink_scout.tak --configure
# The setup prompt adds PYTAK_TLS_CLIENT_PASSWORD privately. Never paste it here.
# Official keys: https://pytak.readthedocs.io/en/stable/configuration/
[aetherlink_scout]
COT_URL = tls+wo://tak.c5solutionsgroup.com:8089
PYTAK_TLS_CLIENT_CERT = /ABSOLUTE/PATH/TO/DRONECOT.p12
PYTAK_TLS_CLIENT_CAFILE = /ABSOLUTE/PATH/TO/ca.pem
PYTAK_TLS_DONT_VERIFY = 0
PYTAK_TLS_DONT_CHECK_HOSTNAME = 0
COT_STALE = 30
SENSOR_ID = AetherLink-Scout-laptop
